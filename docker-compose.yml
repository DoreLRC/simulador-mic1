# Para rodar:
#   docker compose up --build      →  http://localhost:8000
#   docker compose down            →  para e remove o container
name: mic1-simulador   # nome fixo: a pasta do projeto tem espaço e maiúsculas

services:
  web:
    build:
      context: .
    image: mic1-simulador:latest
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
