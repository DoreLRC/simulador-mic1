# Configuração das ferramentas de desenvolvimento (o projeto não é instalado como pacote).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
# Código compatível com Python 3.11+ (venv local) e 3.14 (container).
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
